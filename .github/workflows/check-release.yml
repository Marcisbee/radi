name: Check release tooling

on:
  pull_request:
    paths: ['src/**', 'starter/**', 'tests/**', '.github/scripts/**', '.github/workflows/check-release.yml', '.github/workflows/publish-npm.yml', 'deno*', 'tsconfig*', 'build.npm.ts']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/scripts/*.test.cjs
      - run: npx --yes playwright@1.64.1 install --with-deps --only-shell chromium
        timeout-minutes: 3
      - run: deno task test
      - run: deno task test:static
      - run: deno task test:router
      - run: deno run -A build.npm.ts
        env:
          RELEASE_VERSION: 0.0.0-release-check
      - name: Check packaged version
        run: node -e "if (require('./npm/package.json').version !== '0.0.0-release-check') process.exit(1)"
      - run: deno task test:starters
      - run: npm pack --dry-run
        working-directory: npm
      - run: npm pack --dry-run
        working-directory: npm-starter
