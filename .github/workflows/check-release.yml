name: Check release tooling

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/scripts/draft-release.test.cjs
      - run: npx --yes playwright@1.56.1 install --with-deps chromium
      - run: deno task test
      - run: deno run -A build.npm.ts
        env:
          RELEASE_VERSION: 0.0.0-release-check
      - name: Check packaged version
        run: node -e "if (require('./npm/package.json').version !== '0.0.0-release-check') process.exit(1)"
      - run: npm pack --dry-run
        working-directory: npm
